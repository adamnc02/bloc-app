<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Test</title>
</head>
<body style="background:#000;color:#fff;font-family:monospace;padding:20px;">
<h2>Camera Test</h2>
<div id="status">Tap the button</div>
<br>
<button onclick="test()" style="padding:12px 24px;font-size:16px;">Test Camera</button>
<br><br>
<video id="v" autoplay playsinline muted style="width:100%;max-height:300px;"></video>
<script>
async function test() {
  document.getElementById('status').textContent = 'Requesting...';
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    document.getElementById('v').srcObject = s;
    document.getElementById('status').textContent = 'SUCCESS - camera working';
  } catch(e) {
    document.getElementById('status').textContent = 'ERROR: ' + e.name + ' - ' + e.message;
  }
}
</script>
</body>
</html>
