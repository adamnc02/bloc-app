<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161826" />
    <meta name="robots" content="noindex" />
    <title>BLOC Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- The splash (bloc-splash design, BLOC Coach version; TECHNICAL §139). Its styles are
         inline in <head> and its markup and script come before #root, so it paints before the
         app's bundle has loaded (PORTING.md). Pure CSS animation; the script only times the
         8.5 s hand-over and the skip button, then removes #splash from the page. -->
    <style>
/* BLOC Coach splash — v9 */
#splash {
  --splash-bg: #161826;
  --splash-brand: #2fb98a;
  --splash-block: #3b4063;
  --splash-flash: #7ff0c6;
  --splash-flash-top: #bff7e2;
  --splash-text: #F2F2F2;
  --splash-dark-text: #161826;
  --splash-muted: #8a8fa8;

  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 38%, #1c1f30, var(--splash-bg) 75%);
  overflow: hidden;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#splash.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#splash .splash-skip {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  right: max(16px, env(safe-area-inset-right));
  width: 36px; height: 36px; border-radius: 50%;
  border: 0.5px solid rgba(242,242,242,0.25);
  background: rgba(255,255,255,0.06);
  color: var(--splash-text); font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 1;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease;
}
#splash .splash-skip:active { background: rgba(255,255,255,0.16); }

/* The whole scene is one SVG: the mark, the type and the tagline share one
   coordinate system, so every position below is a fixed number — nothing is
   measured at runtime. Sits above centre. */
#splash .splash-scene {
  width: 340px; max-width: 86vw; height: auto; display: block; overflow: visible;
  transform: translateY(-12vh);
}

/* ---- the mark: starts big and centred (inside the REPEAT loop), settles into the lock-up ---- */
#splash .s-mark {
  transform-box: view-box; transform-origin: 0 0;
  animation: sMarkSettle 0.9s cubic-bezier(0.3, 0.9, 0.4, 1) 3.9s both;
}
@keyframes sMarkSettle {
  from { transform: translate(253.9px, 80.05px) scale(3.35) translate(-52px, -50px); }
  to   { transform: translate(0px, 0px) scale(1) translate(0px, 0px); }
}

/* ---- bars: slide in bottom → top, flash on landing, wave, then pulse ---- */
#splash .s-bar { animation: sBarIn 0.5s ease-out both; }
#splash .s-b1 { animation-delay: 0.3s; }
#splash .s-b2 { animation-delay: 0.95s; }
#splash .s-b3 { animation-delay: 1.6s; }
@keyframes sBarIn {
  0%   { opacity: 0; transform: translateX(-26px); }
  55%  { opacity: 1; transform: translateX(3px); }
  100% { opacity: 1; transform: none; }
}
#splash .s-rect { fill: var(--splash-block); transform-box: fill-box; transform-origin: center; }
#splash .s-r3 { fill: var(--splash-brand); }
#splash .s-r1 { animation: sFlash 0.5s ease-out 0.3s, sWave 0.6s ease-in-out 2.6s, sPulse 1.6s ease-in-out 5.2s infinite; }
#splash .s-r2 { animation: sFlash 0.5s ease-out 0.95s, sWave 0.6s ease-in-out 2.75s, sPulse 1.6s ease-in-out 5.38s infinite; }
#splash .s-r3 { animation: sFlashTop 0.55s ease-out 1.6s, sWaveTop 0.6s ease-in-out 2.9s, sPulseTop 1.6s ease-in-out 5.56s infinite; }
@keyframes sFlash {
  0%, 100% { fill: var(--splash-block); transform: none; }
  55%      { fill: var(--splash-flash); transform: scale(1.06); }
}
@keyframes sFlashTop {
  0%, 100% { fill: var(--splash-brand); transform: none; }
  55%      { fill: var(--splash-flash-top); transform: scale(1.08); }
}
@keyframes sWave {
  0%, 100% { fill: var(--splash-block); transform: none; }
  40%      { fill: var(--splash-brand); transform: scale(1.05); }
}
@keyframes sWaveTop {
  0%, 100% { fill: var(--splash-brand); transform: none; }
  40%      { fill: var(--splash-flash); transform: scale(1.08); }
}
@keyframes sPulse {
  0%, 40%, 100% { fill: var(--splash-block); transform: none; }
  14%           { fill: var(--splash-brand); transform: scale(1.05); }
}
@keyframes sPulseTop {
  0%, 40%, 100% { fill: var(--splash-brand); transform: none; }
  14%           { fill: var(--splash-flash); transform: scale(1.08); }
}

/* ---- REPEAT: a dashed loop wrapped round the whole stack, slanted to follow
   the staircase. It closes in round the bars, its dashes keep travelling round
   while the green wave runs up the stack, and it fades as the mark settles. ---- */
#splash .s-loop {
  transform-box: fill-box; transform-origin: center;
  animation: sLoopIn 0.55s cubic-bezier(0.3, 0.9, 0.4, 1) 2.2s both, sOut 0.35s ease 3.9s forwards;
}
@keyframes sLoopIn {
  from { opacity: 0; transform: scale(1.12); }
  to   { opacity: 1; transform: none; }
}
#splash .s-loop-line {
  fill: rgba(47, 185, 138, 0.05);
  stroke: var(--splash-brand); stroke-width: 1px; stroke-dasharray: 3.2 2.2;
  animation: sMarch 0.8s linear 2.2s infinite;
}
@keyframes sMarch { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -10.8; } }
#splash .s-chip { fill: #1b1e2f; }
#splash .s-loop-icon { transform-box: fill-box; transform-origin: center; animation: sSpin 0.9s cubic-bezier(0.4, 0, 0.2, 1) 2.6s; }
#splash .s-rep-arc { fill: none; stroke: var(--splash-brand); stroke-width: 2.3px; stroke-linecap: round; }
#splash .s-rep-head { fill: var(--splash-brand); }
@keyframes sSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ---- pillar icons inside the bars: gone once the mark settles ---- */
#splash .s-icon { opacity: 0; fill: var(--splash-text); animation: sOut 0.3s ease 3.9s both; }
#splash .s-icon-dark { fill: var(--splash-dark-text); }
@keyframes sOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes sIn  { from { opacity: 0; } to { opacity: 1; } }

/* ---- BLOC type ---- */
#splash .s-type { fill: var(--splash-text); animation: sTypeIn 0.7s cubic-bezier(0.3, 0.9, 0.4, 1) 4.25s both; }
@keyframes sTypeIn { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

/* ---- the four pillar words: labels in the bars / on the loop, then the tagline ---- */
#splash .s-word {
  font-size: 18px; font-weight: 700; text-anchor: middle;
  fill: var(--splash-muted);
  /* 🚨 Each word scales about its own centre, given in the drawing's units
     (view-box). With fill-box, WebKit centres SVG text somewhere else, so on
     an iPhone each word started ~11 units left of where Chrome puts it, and
     REPEAT sat on its spinning icon. */
  transform-box: view-box;
}
#splash .s-w-train  { transform-origin: 56.5px 143px; }
#splash .s-w-fuel   { transform-origin: 157px 143px; }
#splash .s-w-over   { transform-origin: 289.5px 143px; }
#splash .s-w-repeat { transform-origin: 440px 143px; }
#splash .s-w-over { fill: var(--splash-brand); font-weight: 800; }
#splash .s-w-train  { animation: sIn 0.35s ease 0.75s both, sFlyTrain 0.9s cubic-bezier(0.3, 0.9, 0.4, 1) 3.9s both, sWordOut 0.4s ease-in 5.9s forwards; }
#splash .s-w-fuel   { animation: sIn 0.35s ease 1.4s both,  sFlyFuel 0.9s cubic-bezier(0.3, 0.9, 0.4, 1) 3.95s both, sWordOut 0.4s ease-in 6.0s forwards; }
#splash .s-w-over   { animation: sIn 0.35s ease 2.05s both, sFlyOver 0.9s cubic-bezier(0.3, 0.9, 0.4, 1) 4.0s both, sWordOut 0.4s ease-in 6.1s forwards; }
#splash .s-w-repeat { animation: sIn 0.35s ease 2.5s both,  sFlyRepeat 0.9s cubic-bezier(0.3, 0.9, 0.4, 1) 4.05s both, sWordOut 0.4s ease-in 6.2s forwards; }
@keyframes sFlyTrain  { from { transform: translate(175.8px, 54.8px) scale(0.97);     fill: var(--splash-text); } to { transform: none; fill: var(--splash-muted); } }
@keyframes sFlyFuel   { from { transform: translate(115.5px, -63.8px) scale(0.97);    fill: var(--splash-text); } to { transform: none; fill: var(--splash-muted); } }
@keyframes sFlyOver   { from { transform: translate(23.2px, -182.1px) scale(0.97);  fill: var(--splash-dark-text); } to { transform: none; fill: var(--splash-brand); } }
@keyframes sFlyRepeat { from { transform: translate(-104.2px, -257.9px) scale(0.97); fill: var(--splash-brand); } to { transform: none; fill: var(--splash-muted); } }
#splash .s-dot { font-size: 18px; text-anchor: middle; fill: var(--splash-muted); transform-box: fill-box; transform-origin: center; animation: sIn 0.4s ease 4.9s both, sWordOut 0.4s ease-in 5.95s forwards; }
#splash .s-dot-2 { animation-delay: 4.9s, 6.05s; }
#splash .s-dot-3 { animation-delay: 4.9s, 6.15s; }
/* COACH version: once they've landed, the pillar words and bullets drop away,
   left to right, to make room for COACH */
@keyframes sWordOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(10px); } }

/* ---- at the same time BLOC drifts up, arriving as the last word goes (and 4 units right, to the Coach lock-up's spacing)
   while the bars stay put, so the stack ends up centred on BLOC + COACH ---- */
#splash .s-drift {
  transform: translate(4px, -32px);
  animation: sDrift 0.7s cubic-bezier(0.45, 0, 0.2, 1) 5.9s both;
}
@keyframes sDrift { from { transform: none; } to { transform: translate(4px, -32px); } }

/* ---- COACH: Dune hairline italic, drawn stroke by stroke into the space ---- */
#splash .s-coach-line {
  fill: none; stroke: var(--splash-brand); stroke-width: 6px; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 0;
  animation: sDraw 0.8s cubic-bezier(0.4, 0, 0.2, 1) both;
}
#splash .s-c1 { animation-delay: 6.55s; }
#splash .s-c2 { animation-delay: 6.65s; }
#splash .s-c3 { animation-delay: 6.75s; }
#splash .s-c4 { animation-delay: 6.85s; }
#splash .s-c5 { animation-delay: 6.95s; }
@keyframes sDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  #splash * { animation: none !important; }
  #splash .s-loop, #splash .s-word, #splash .s-dot { opacity: 0; }
}
    </style>
  </head>
  <body>

<script>
// BLOC Coach splash — the animation itself is pure CSS and starts as soon as #splash
// is painted. This script only times the hand-over (and the skip button).
(function () {
  var SPLASH_MS = 8500;   // matches the CSS timeline: final state held briefly, then fade
  var REDUCED_MS = 1400;  // reduced motion: the finished logo, shown briefly
  var startedAt = Date.now(); // this script runs straight after #splash is parsed

  function boot() {
    var splash = document.getElementById('splash');
    if (!splash) return;

    function revealApp() {  }

    // Plays on every fresh load. Kept as a named function so a different rule
    // (e.g. once per day) can be swapped in later.
    function qualifiesForSplash() { return true; }

    if (!qualifiesForSplash()) {
      splash.style.display = 'none';
      revealApp();
      return;
    }

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var total = reduce ? REDUCED_MS : SPLASH_MS;
    var done = false;
    var timer;

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      splash.classList.add('fade-out');
      revealApp();
      // take it out of the page once the fade has finished, so it never sits over the app
      setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
    }

    var skipBtn = document.getElementById('splash-skip');
    if (skipBtn) skipBtn.addEventListener('click', finish);

    // time from when the splash started, not from DOMContentLoaded, so a slow
    // parse of the rest of the page doesn't stretch the splash
    timer = setTimeout(finish, Math.max(0, total - (Date.now() - startedAt)));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
