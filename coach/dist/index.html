    <script>
    // §159: the safe-area insets, MEASURED (BLOC's index.html, TECHNICAL §5). On an installed iPhone app WebKit can
    // hand a stale or wrong env(safe-area-inset-*) through a CSS custom property, so a probe element with the env()
    // set directly is read, and --safe-top / --safe-bottom are set in pixels. Re-measured over the first seconds (the
    // standalone launch settles late) and on every resize and rotation.
    (function () {
      function measureEnv(prop) {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(' + prop + ', 0px);visibility:hidden;pointer-events:none;';
        document.documentElement.appendChild(el);
        var v = el.offsetHeight;
        document.documentElement.removeChild(el);
        return v;
      }
      function setSafeAreaVars() {
        var r = document.documentElement.style;
        r.setProperty('--safe-top', measureEnv('safe-area-inset-top') + 'px');
        r.setProperty('--safe-bottom', measureEnv('safe-area-inset-bottom') + 'px');
      }
      setSafeAreaVars();
      [100, 300, 600, 1000, 2000].forEach(function (ms) { setTimeout(setSafeAreaVars, ms); });
      window.addEventListener('resize', setSafeAreaVars);
      window.addEventListener('orientationchange', function () { setTimeout(setSafeAreaVars, 300); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setSafeAreaVars);
    })();
    </script>

<script>
// BLOC Coach splash — the animation itself is pure CSS and starts as soon as #splash
// is painted. This script only times the hand-over (and the skip button).
(function () {
  var SPLASH_MS = 8500;   // matches the CSS timeline: final state held briefly, then fade
  var REDUCED_MS = 1400;  // reduced motion: the finished logo, shown briefly
  var startedAt = Date.now(); // this script runs straight after #splash is parsed

  function boot() {
    var splash = document.getElementById('splash');
    if (!splash) return;

    function revealApp() {  }

    // Plays on every fresh load. Kept as a named function so a different rule
    // (e.g. once per day) can be swapped in later.
    function qualifiesForSplash() { return true; }

    if (!qualifiesForSplash()) {
      splash.style.display = 'none';
      revealApp();
      return;
    }

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var total = reduce ? REDUCED_MS : SPLASH_MS;
    var done = false;
    var timer;

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      splash.classList.add('fade-out');
      revealApp();
      // take it out of the page once the fade has finished, so it never sits over the app
      setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
    }

    var skipBtn = document.getElementById('splash-skip');
    if (skipBtn) skipBtn.addEventListener('click', finish);

    // time from when the splash started, not from DOMContentLoaded, so a slow
    // parse of the rest of the page doesn't stretch the splash
    timer = setTimeout(finish, Math.max(0, total - (Date.now() - startedAt)));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
